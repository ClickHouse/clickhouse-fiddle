openapi: 3.1.0
info:
  title: ClickHouse Playground API
  description: API for ClickHouse Playground - an online service to run SQL queries directly from a browser
  version: 1.0.0
  contact:
    name: ClickHouse Playground
servers:
  - url: https://fiddle.clickhouse.com/api
    description: Production server

paths:
  /tags:
    get:
      summary: Get available ClickHouse version tags
      description: Returns a list of available ClickHouse version tags that can be used for running queries
      operationId: getImageTags
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetImageTagsResponse"

  /build-types:
    get:
      summary: Get available build types
      description: Returns the list of selectable ClickHouse build types (release, debug, sanitizers)
      operationId: getBuildTypes
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBuildTypesResponse"

  /images/prepare:
    post:
      summary: Prepare a non-release ClickHouse image
      description: >
        Triggers an asynchronous local build of a non-release (debug/sanitizer) image for the
        given version and build type, returning immediately with the current build state.
        Poll GET /images/status until the state is "ready" before running a query.
        Release builds always return "ready".
      operationId: prepareImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareImageRequest"
      responses:
        "200":
          description: Current build state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageStatusResponse"
        "400":
          description: Bad request (empty/unknown version or unknown build type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Local builds are not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse" # TODO: Add examples of errors.

  /images/status:
    get:
      summary: Get the build state of a non-release image
      description: Returns the current build state for a (version, build_type) pair.
      operationId: getImageStatus
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: string
        - name: build_type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/BuildType"
      responses:
        "200":
          description: Current build state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageStatusResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runs:
    post:
      summary: Run a ClickHouse SQL query
      description: Executes a SQL query against a specified ClickHouse version
      operationId: runQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunQueryRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunQueryResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emptyQuery:
                  value:
                    error:
                      message: query cannot be empty
                      code: 400
                unknownVersion:
                  value:
                    error:
                      message: unknown version
                      code: 400
                queryTooLong:
                  value:
                    error:
                      message: query length (10000) cannot exceed 8192
                      code: 400
                unknownDatabase:
                  value:
                    error:
                      message: unknown database
                      code: 400
        "409":
          description: The requested non-release image has not been built yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: image is not ready, prepare it first
                  code: 409
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: no available runners
                  code: 429
        "501":
          description: A non-release build was requested but local builds are not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runs/{id}:
    get:
      summary: Get a specific query run
      description: Returns details about a previously executed query run
      operationId: getQueryRun
      parameters:
        - name: id
          in: path
          description: ID of the query run
          required: true
          schema:
            type: string
            format: uuid
        - name: include_raw_output
          in: query
          description: Include the exact output bytes as Base64 in output_base64.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetQueryRunResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: missed id
                  code: 400
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: run not found
                  code: 404

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
      required:
        - error

    ErrorDetail:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message
        code:
          type: integer
          description: HTTP status code or custom error code
      required:
        - message
        - code

    GetImageTagsResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            tags:
              type: array
              items:
                type: string
              description: List of available ClickHouse version tags
          required:
            - tags
      required:
        - result

    BuildType:
      type: string
      description: ClickHouse build kind. "release" images come from Docker Hub; the others are built locally from CI artifacts.
      default: release
      enum:
        - release
        - debug
        - asan
        - tsan
        - msan
        - ubsan

    GetBuildTypesResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            build_types:
              type: array
              items:
                $ref: "#/components/schemas/BuildType"
          required:
            - build_types
      required:
        - result

    PrepareImageRequest:
      type: object
      properties: # TODO: Add examples of input values.
        version:
          type: string
          description: ClickHouse version tag (as returned by GET /tags)
        build_type:
          $ref: "#/components/schemas/BuildType"
      required:
        - version
        - build_type

    ImageStatusResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            state:
              type: string
              enum:
                - building
                - ready
                - failed
              description: Current build state of the image
            detail:
              type: string
              description: Human-readable progress stage while building (e.g. "Downloading packages", "Installing packages")
            error:
              type: string
              description: Failure reason when state is "failed"
          required:
            - state
      required:
        - result

    RunQueryRequest:
      type: object
      properties:
        query:
          type: string
          description: SQL query to execute
        version:
          type: string
          description: ClickHouse version tag to use
        build_type:
          $ref: "#/components/schemas/BuildType"
        database:
          type: string
          description: Database type (defaults to "clickhouse" if not specified)
          default: clickhouse
          enum:
            - clickhouse
        settings:
          type: object
          properties:
            clickhouse:
              type: object
              properties:
                output_format:
                  type: string
                  description: Output format for ClickHouse query results
        include_raw_output:
          type: boolean
          description: Request exact output bytes as Base64 in output_base64.
      required:
        - query
        - version

    RunQueryResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            query_run_id:
              type: string
              format: uuid
              description: Unique identifier for the query run
            output:
              type: string
              description: Query execution output
            output_base64:
              type: string
              format: byte
              description: Exact query output bytes, present when include_raw_output is true
            output_truncated:
              type: boolean
              description: >-
                True when the server stopped reading the output at its size cap. The output
                fields hold the part that was read.
            output_dropped:
              type: boolean
              description: >-
                True when the output was not stored because the run would exceed the storage
                item size limit. This response still carries the output; GET /runs/{id} will
                return the run without it.
            time_elapsed:
              type: string
              description: Time taken to execute the query
          required:
            - query_run_id
            - output
            - time_elapsed
      required:
        - result

    GetQueryRunResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            query_run_id:
              type: string
              format: uuid
              description: Unique identifier for the query run
            database:
              type: string
              description: Database type used for the query
            version:
              type: string
              description: ClickHouse version tag used for the query
            build_type:
              $ref: "#/components/schemas/BuildType"
            settings:
              type: object
              description: Settings used for the query run
              properties:
                clickhouse:
                  type: object
                  properties:
                    output_format:
                      type: string
                      description: Output format used for the query results
            input:
              type: string
              description: The SQL query that was executed
            output:
              type: string
              description: Query execution output
            output_base64:
              type: string
              format: byte
              description: Exact query output bytes, present when include_raw_output is true
            output_truncated:
              type: boolean
              description: True when the server cut the output at its size cap during the run.
            output_dropped:
              type: boolean
              description: >-
                True when the output was not stored because it did not fit the storage item
                size limit. output is empty; run the query again to see the result.
          required:
            - query_run_id
            - version
            - input
            - output
      required:
        - result
