name: Run Go tests

on:
  push:
    tags:
      - v*
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'internal/qrunner/dockerengine/buildcontext/**'
      - '.github/workflows/go-tests.yml'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'internal/qrunner/dockerengine/buildcontext/**'
      - '.github/workflows/go-tests.yml'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: RUN_DOCKER_TESTS=true go test -v ./...
