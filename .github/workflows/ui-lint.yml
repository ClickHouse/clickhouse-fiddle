name: Lint UI

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - '.github/workflows/ui-lint.yml'
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ui-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
